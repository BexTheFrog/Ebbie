name: ebbie
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_speed_dial: ^7.0.0
  curved_navigation_bar: ^1.0.6

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  webview_flutter: ^4.2.1
  flutter_launcher_icons: ^0.14.4
  dropdown_button2: ^2.3.9
  table_calendar: ^3.2.0
  flutter_localizations:
    sdk: flutter
  lucide_icons_flutter: ^3.1.1
  flutter_form_builder: ^10.1.0
  url_launcher: ^6.3.2
  percent_indicator: ^4.2.5
  persistent_bottom_nav_bar: ^6.2.1
  provider: ^6.1.5+1
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  date_field: ^6.0.3+1
  gif: ^2.3.0
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/cortex/cortex_idle.gif
    - assets/images/cortex/cortex_eating.gif
    - assets/images/cortex/cortex_shower.gif


  fonts:
    - family: CerebriSansPro
      fonts:
        - asset: assets/fonts/CerebriSansPro-Bold.ttf
