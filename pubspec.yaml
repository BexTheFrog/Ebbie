name: ebbie
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_speed_dial: ^7.0.0
  curved_navigation_bar: ^1.0.6


  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

  flutter_launcher_icons: ^0.14.4
  dropdown_button2: ^2.3.9
  flutter_calendar_carousel: ^2.5.4
  sqflite: ^2.4.2
  lucide_icons_flutter: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/


  fonts:
    - family: CerebriSansPro
      fonts:
        - asset: assets/fonts/CerebriSansPro-Bold.ttf
